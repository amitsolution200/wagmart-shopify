<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wagmart Premium Pet Store CTA Banner Preview</title>
  
  <!-- Theme Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #ffffff;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      color: #1F2937;
      -webkit-font-smoothing: antialiased;
    }

    /* Scoped CTA Banner CSS strictly mirroring wagmart-pet-cta.liquid */
    .wm-pet-cta-banner {
      background-color: #FAF8F5;
      padding-top: 40px;
      padding-bottom: 48px;
      position: relative;
      width: 100%;
      overflow: hidden;
    }

    @media (min-width: 768px) {
      .wm-pet-cta-banner {
        padding-top: 64px;
        padding-bottom: 64px;
      }
    }

    @media (min-width: 1200px) {
      .wm-pet-cta-banner {
        padding-top: 76px;
        padding-bottom: 76px;
      }
    }

    .wm-pet-cta-banner__container {
      max-width: 1400px;
      margin: 0 auto;
      padding-left: clamp(16px, 4vw, 56px);
      padding-right: clamp(16px, 4vw, 56px);
    }

    .wm-pet-cta-banner__grid {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    @media (min-width: 768px) {
      .wm-pet-cta-banner__grid {
        display: grid;
        grid-template-columns: minmax(0, 50fr) minmax(0, 50fr);
        align-items: center;
        gap: clamp(32px, 5vw, 72px);
      }
    }

    /* Left Column: Image wrapper */
    .wm-pet-cta-banner__media {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 0;
      background: transparent;
    }

    .wm-pet-cta-banner__img {
      width: 100%;
      max-width: 620px;
      height: auto;
      max-height: 480px;
      object-fit: contain;
      aspect-ratio: 1200 / 896;
      display: block;
      margin: 0 auto;
      background: transparent;
      filter: drop-shadow(0 12px 28px rgba(24, 59, 43, 0.08));
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @media (min-width: 1200px) {
      .wm-pet-cta-banner__img {
        max-height: 520px;
      }
    }

    .wm-pet-cta-banner:hover .wm-pet-cta-banner__img {
      transform: scale(1.015);
    }

    /* Right Column: CTA Content */
    .wm-pet-cta-banner__content {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 580px;
      margin: 0 auto;
    }

    @media (min-width: 768px) {
      .wm-pet-cta-banner__content {
        align-items: flex-start;
        text-align: left;
        margin: 0;
      }
    }

    .wm-pet-cta-banner__eyebrow {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #2E604A;
      margin-bottom: 14px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .wm-pet-cta-banner__eyebrow-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: currentColor;
      display: inline-block;
    }

    .wm-pet-cta-banner__heading {
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: 700;
      font-size: clamp(32px, 3.4vw, 50px);
      line-height: 1.15;
      letter-spacing: -0.02em;
      color: #183B2B;
      margin: 0 0 16px 0;
    }

    .wm-pet-cta-banner__description {
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-weight: 500;
      font-size: clamp(15px, 1.15vw, 17px);
      line-height: 1.6;
      color: #44564C;
      margin: 0 0 32px 0;
      max-width: 480px;
    }

    .wm-pet-cta-banner__actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      width: 100%;
      max-width: 440px;
      gap: 14px;
      margin-bottom: 24px;
    }

    @media (min-width: 600px) {
      .wm-pet-cta-banner__actions {
        flex-direction: row;
        align-items: center;
        justify-content: center;
        width: auto;
        max-width: none;
        gap: 18px;
      }
    }

    @media (min-width: 768px) {
      .wm-pet-cta-banner__actions {
        justify-content: flex-start;
        gap: 18px;
      }
    }

    .wm-pet-cta-banner__btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background-color: #183B2B;
      color: #FFFFFF;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-weight: 800;
      font-size: 13.5px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      padding: 14px 24px;
      border-radius: 9999px;
      box-shadow: 0 4px 14px rgba(24, 59, 43, 0.16);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      cursor: pointer;
      border: none;
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      white-space: nowrap;
    }

    @media (min-width: 600px) {
      .wm-pet-cta-banner__btn {
        width: auto;
        padding: 16px 34px;
      }
    }

    .wm-pet-cta-banner__btn:hover {
      background-color: #234E39;
      color: #FFFFFF;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(24, 59, 43, 0.22);
    }

    .wm-pet-cta-banner__btn:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(24, 59, 43, 0.14);
    }

    .wm-pet-cta-banner__btn:focus-visible {
      outline: 3px solid #7a46e5;
      outline-offset: 3px;
    }

    .wm-pet-cta-banner__btn-arrow {
      width: 14px;
      height: 14px;
      transition: transform 0.25s ease;
    }

    .wm-pet-cta-banner__btn:hover .wm-pet-cta-banner__btn-arrow {
      transform: translateX(4px);
    }

    .wm-pet-cta-banner__btn-secondary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: #ffffff;
      color: #183B2B !important;
      border: 1.5px solid #D5CEBF;
      font-family: 'Nunito', system-ui, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 13.5px;
      text-decoration: none;
      padding: 13px 22px;
      border-radius: 9999px;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
      width: 100%;
      box-sizing: border-box;
      white-space: nowrap;
    }

    @media (min-width: 600px) {
      .wm-pet-cta-banner__btn-secondary {
        width: auto;
        padding: 15px 26px;
      }
    }

    .wm-pet-cta-banner__btn-secondary:hover {
      border-color: #183B2B;
      background-color: #FAF8F5;
      transform: translateY(-1px);
    }

    @media (prefers-reduced-motion: reduce) {
      .wm-pet-cta-banner__img,
      .wm-pet-cta-banner__btn,
      .wm-pet-cta-banner__btn-arrow {
        transition: none !important;
        transform: none !important;
      }
    }

    /* Demonstration context info bar */
    .preview-bar {
      background: #111827;
      color: #F3F4F6;
      padding: 10px 16px;
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
    }
    .preview-badge {
      background: #2E604A;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <!-- Top Demo Bar -->
  <div class="preview-bar">
    <div style="display:flex; align-items:center; gap:8px;">
      <span class="preview-badge">SHOPIFY SECTION</span>
      <span><strong>Wagmart Pet Store CTA Banner</strong> (<code>sections/wagmart-pet-cta.liquid</code>)</span>
    </div>
    <span style="color:#9CA3AF; font-size:12px;">Responsive: Desktop (1200px+), Tablet (768px-1199px), Mobile (&lt;768px)</span>
  </div>

  <!-- RENDERED SECTION -->
  <section
    id="wm-pet-cta-banner-demo"
    class="wm-pet-cta-banner"
    aria-labelledby="wm-pet-cta-heading"
  >
    <div class="wm-pet-cta-banner__container">
      <div class="wm-pet-cta-banner__grid">
        
        <!-- Left Column: Transparent Pet Product Image -->
        <figure class="wm-pet-cta-banner__media">
          <img
            src="./assets/wagmart-pet-products.png"
            alt="Wagmart premium pet essentials collection: dog food bag with golden retriever, ceramic pet bowl with kibble, grooming brush, herbal shampoo pump bottle, rope toy, and textured chew ball"
            class="wm-pet-cta-banner__img"
            loading="eager"
            width="1200"
            height="896"
          >
        </figure>

        <!-- Right Column: CTA Content -->
        <div class="wm-pet-cta-banner__content">
          <div class="wm-pet-cta-banner__eyebrow">
            <span class="wm-pet-cta-banner__eyebrow-dot" aria-hidden="true"></span>
            <span>MADE FOR HAPPY PETS</span>
          </div>

          <h2 id="wm-pet-cta-heading" class="wm-pet-cta-banner__heading">
            Everything Your Pet Needs
          </h2>

          <p class="wm-pet-cta-banner__description">
            Discover everyday essentials for happier, healthier pets.
          </p>

          <div class="wm-pet-cta-banner__actions">
            <a
              href="#shop-products"
              class="wm-pet-cta-banner__btn"
              id="cta-shop-button"
              aria-label="SHOP PET PRODUCTS - Everything Your Pet Needs"
            >
              <span>SHOP PET PRODUCTS</span>
              <svg class="wm-pet-cta-banner__btn-arrow" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M14 5l7 7m0 0l-7 7m7-7H3" />
              </svg>
            </a>

            <a
              href="tel:+917777985896"
              class="wm-pet-cta-banner__btn-secondary"
              id="cta-call-button"
              aria-label="Call Wagmart customer support at +91 77779 85896"
            >
              <svg style="width:16px;height:16px;color:#2E604A;" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
              </svg>
              <span>Call Us Now</span>
            </a>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
